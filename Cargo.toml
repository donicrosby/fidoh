[workspace]
resolver = "2"
members = [
    "crates/fidoh-core",
    "crates/fidoh-transport-soft",
    "crates/fidoh-transport-pcsc",
    "crates/fidoh-transport-hid",
    "crates/fidoh-tokio",
    "crates/fidoh-cli-ui",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/donicrosby/fidoh"

# Core invariants enforced workspace-wide:
# - No tokio/async-std/smol in core crates (runtime-agnostic).
# - deny(unsafe_code) per-crate unless explicitly justified in design.md.
# - No unwrap/expect outside tests.
