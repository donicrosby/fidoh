[package]
name = "fidoh-core"
description = "CTAP2 data model, canonical CBOR, and status codes — cleanroom, no_std-friendly core of fidoh"
version = "0.1.0-alpha.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints.rust]
unsafe_code = "deny"

[dependencies]
# Intentionally dependency-free runtime: canonical CBOR is hand-rolled
# (serde_cbor cannot enforce CTAP2.1 §8 sorted keys / indefinite-length
# rejection) and errors use manual Display impls (thiserror is std-only
# on MSRV 1.75). See openspec/changes/core-model/design.md.

[dev-dependencies]
hex = "0.4"
