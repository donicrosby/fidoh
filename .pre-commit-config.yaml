# Conventional Commits enforcement — one definition, two consumers:
# the local commit-msg hook and the `commits` job in .github/workflows/ci.yml
# (they run the same hook, so they cannot drift).
# One-time setup per clone: pip install pre-commit && pre-commit install --hook-type commit-msg
# DEFAULT_TYPES already covers feat/fix/build/chore/ci/docs/perf/refactor/revert/style/test.
default_install_hook_types:
  - commit-msg

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
