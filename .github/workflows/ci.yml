# fidoh CI — the gates docs/testing.md promises.
#
# Matrix contract (docs/testing.md §CI contract):
# - fmt + clippy + openspec validate on every commit
# - default-feature tests (soft token) are the mandatory green tier:
#   scoped to the default-graph crates (-p fidoh -p fidoh-core
#   -p fidoh-transport-soft). The job installs NO PC/SC system library,
#   so if the default build graph ever grows an OS dependency, the
#   build fails — the async-core "Default build is OS-dependency-free"
#   scenario, enforced by the machine. (Full-workspace `cargo test`
#   builds every member's build script, and pcsc-sys links against
#   libpcsclite even when the binding feature is off — that is why the
#   default tier is package-scoped rather than --workspace.)
# - all-feature tests cover hid/pcsc/tokio compilation and the
#   pure-framing pcsc layer
# - MSRV job pins 1.75 (workspace rust-version): default build + tests
#   + all-features build, all --locked. The lockfile is pinned to
#   pre-edition2024 transitive versions (base64ct 1.7.3, zeroize 1.8.2)
#   so cargo 1.75 can resolve it; bump pins only with an MSRV re-check.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Least privilege: this workflow only reads code and never touches the
# API, so the implicit GITHUB_TOKEN gets exactly contents:read regardless
# of the repo-level default.
permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - name: PC/SC headers (all-features build)
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default-soft
            cmd: cargo test --locked -p fidoh -p fidoh-core -p fidoh-transport-soft
            pcsclib: false
          - name: all-features
            cmd: cargo test --locked --workspace --all-features
            pcsclib: true
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - name: PC/SC headers
        if: ${{ matrix.pcsclib }}
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - run: ${{ matrix.cmd }}

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.75.0
      - uses: Swatinem/rust-cache@v2.9.2
      - name: PC/SC headers
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: default build (soft only)
        run: cargo build --locked
      - name: default-tier tests
        run: cargo test --locked -p fidoh -p fidoh-core -p fidoh-transport-soft
      - name: all-features build
        run: cargo build --locked --workspace --all-features

  # Conventional-commit gate: the same hook repo developers get locally
  # (.pre-commit-config.yaml), run against this push/PR's commit range.
  # `git log --format=%H` supplies message-file arguments (pre-commit's
  # documented range invocation for commit-msg hooks).
  # Latest verified 2026-09-26: pre-commit/action v3.0.1,
  # conventional-pre-commit v4.4.0, actions/setup-python v6.1.0.
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.12"
      - run: pip install pre-commit && pre-commit install --hook-type commit-msg
      # Range = commits actually arriving with this event (push events carry
      # the old head in github.event.before; PRs carry base_ref).
      - name: Check every incoming commit message
        run: |
          BASE="${{ github.event.before || format('origin/{0}', github.base_ref || 'main') }}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="origin/${{ github.base_ref || 'main' }}"; fi
          git log --format=%H "$BASE..HEAD" > /tmp/commits.txt
          test -s /tmp/commits.txt || { echo "no new commits (merge of already-checked commits) — ok"; exit 0; }
          FAIL=0
          while read -r SHA; do
            git log -1 --format=%B "$SHA" > /tmp/msg.txt
            echo "checking ${SHA::7}: $(head -1 /tmp/msg.txt)"
            pre-commit run --hook-stage commit-msg --commit-msg-filename /tmp/msg.txt || FAIL=1
          done < /tmp/commits.txt
          exit $FAIL
      - name: Verify the hook actually rejects non-conventional messages
        run: |
          echo "not conventional" > /tmp/bad
          # An `if` condition is immune to `set -e`: a rejected probe is the
          # SUCCESS path here. Only a hook that ACCEPTS garbage fails the gate.
          if pre-commit run --hook-stage commit-msg --commit-msg-filename /tmp/bad; then
            echo "UNREACHABLE: hook accepted a non-conventional message" >&2
            exit 1
          fi
          echo "tamper-check OK: hook correctly rejected the probe"

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - run: npm install -g @fission-ai/openspec@1.13.1
      - run: openspec validate --all --strict
